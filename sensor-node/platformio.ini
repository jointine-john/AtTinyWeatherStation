; ATtiny sensor node.
;
; Pick the environment for your chip and sensor board:
;   htu21d          - ATtiny85, HTU21D / SHT21 / Si7021, e.g. GY-21 (default)
;   sht40           - ATtiny85, Sensirion SHT40
;   attiny84_htu21d - ATtiny84/84A, HTU21D / SHT21 / Si7021
;   attiny84_sht40  - ATtiny84/84A, Sensirion SHT40 (the weather station)
;
; Pin-outs for each chip are in src/board.h.
;
; Build & flash:   pio run -t upload                (default environment)
;                  pio run -e sht40 -t upload
; Different node:  PLATFORMIO_BUILD_FLAGS="-DNODE_ID=2" pio run -t upload
; Set fuses (new chip, once):  pio run -t fuses

[platformio]
default_envs = htu21d

[env]
platform = atmelavr
board = attiny85
board_build.f_cpu = 1000000L
build_flags =
    -I${PROJECT_DIR}/../common
    -DINTERVAL_S=300

; 8 MHz internal RC with CKDIV8 (firmware sets the prescaler itself anyway),
; brown-out detector disabled (saves ~20 uA), ISP enabled. The same values
; are right for the ATtiny85 and the ATtiny84.
board_fuses.lfuse = 0x62
board_fuses.hfuse = 0xDF
board_fuses.efuse = 0xFF

; USBasp programmer. For an Arduino running "ArduinoISP" replace the two
; lines below with (see docs/programming.md):
;   upload_protocol = stk500v1
;   upload_port = /dev/ttyACM0
;   upload_speed = 19200
;   upload_flags =
;       -P$UPLOAD_PORT
;       -b$UPLOAD_SPEED
upload_protocol = usbasp
upload_flags = -B 32

[env:htu21d]
build_src_filter = +<*> -<sht40.c>

[env:sht40]
build_src_filter = +<*> -<htu21d.c>

[env:attiny84_htu21d]
board = attiny84
build_src_filter = +<*> -<sht40.c>

[env:attiny84_sht40]
board = attiny84
build_src_filter = +<*> -<htu21d.c>
